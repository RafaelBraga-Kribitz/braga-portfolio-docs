# BRAGA README Quality Standard — machine-readable contract
# Version is bumped whenever a requirement is added, removed, or its check changes.
#
# Fields per requirement
#   id               stable dotted identifier (never renamed; retire with `retired: true`)
#   title            short human label
#   applies_to       list of project types or the word `all`; `interactive`, `incomplete`,
#                    `public_data` are registry flags that also gate applicability
#   severity         required | recommended   (recommended failures are WARN, never FAIL)
#   check            name of the check function in readme_quality/checks.py
#   evidence         what the check looks for (human explanation)
#   remediation      auto | assisted | manual
#                      auto     = readme_quality.fix can apply it from repository evidence
#                      assisted = fix can insert a scaffold that still needs project prose
#                      manual   = an agent or human must write it; never auto-filled
#   human_escalation condition under which the status becomes BLOCKED_HUMAN (null = never)
#   excellence       true when satisfying it counts toward PASS_WITH_EXCELLENCE only
#
# Status vocabulary produced by the gate for every requirement:
#   PASS · PASS_WITH_EXCELLENCE · NOT_APPLICABLE · FAIL · BLOCKED_HUMAN · WARN (recommended only)

version: "1.3.0"
standard: docs/README_STANDARD.md

# Two ceilings, because raw line count punishes exactly the content the standard wants more of.
#   max_readme_lines        rendered lines: prose, headings, list items, tables, images.
#                           Fenced blocks (a Mermaid graph renders as one figure), HTML comment
#                           lines, badge-only lines and blank lines are not counted.
#   max_readme_lines_total  raw lines in the file, so the excluded regions cannot grow unchecked.
# Registry overrides: `max_lines` + `max_lines_reason`, `max_lines_total` + `max_lines_total_reason`.
# An override without its reason is ignored and the default applies.
max_readme_lines: 450
max_readme_lines_total: 1000

project_types:
  analytical:   "Data analysis, modelling, forecasting, experimentation, decision analysis"
  application:  "Interactive application, dashboard, API, simulator with a UI"
  library:      "Installable package with a public API"
  framework:    "Governance kit, agent overlay, skill pack, methodology tooling"
  docs:         "Documentation-only or meta repository"

status_vocabulary: [Prototype, Foundation, In development, Functional, Complete, Maintained, Archived]

epistemic_tags: [VERIFIED, CALIBRATED, SIMULATED, ILLUSTRATIVE]

requirements:

  # ------------------------------------------------------------------ identity
  - id: identity.h1
    title: Human-readable H1 title at the top
    applies_to: [all]
    severity: required
    check: h1_title
    evidence: "First heading is an H1 within the first 5 lines; not a bare repo slug"
    remediation: auto
    human_escalation: null

  - id: identity.hero
    title: Vanity banner first, then badges, then other visuals
    applies_to: [all]
    severity: required
    check: hero_visual
    evidence: "The first element after the H1 is the banner image declared in the registry (`banner:`; generated design-system banner by default), it resolves on disk, the badge row follows it, and no other image, diagram, or code block appears before the badges"
    remediation: auto
    human_escalation: null
    notes: "Auto remediation generates the banner from registry + repository facts and reorders the identity zone: banner, badges, status line, prose, then every other visual (primary chart, screenshot, Mermaid) in its original order."

  - id: identity.badges
    title: Badge row with status, license, and CI where a workflow exists
    applies_to: [all]
    severity: required
    check: badge_row
    evidence: "shields.io or actions badge markup before the first H2; CI badge required when .github/workflows/ci.yml exists; license badge must name the LICENSE file's license"
    remediation: auto
    human_escalation: null

  - id: identity.problem
    title: Problem statement in the first paragraph
    applies_to: [all]
    severity: required
    check: problem_statement
    evidence: "First prose paragraph after H1 is 12-110 words, does not open with 'This is a', 'This repository', 'Python port of', 'A reusable'; for analytical projects it is a question or names a decision"
    remediation: manual
    human_escalation: null

  - id: identity.status_line
    title: Status line in the identity zone using the controlled vocabulary
    applies_to: [all]
    severity: required
    check: status_line
    evidence: "`**Status:** <vocab>` before the first H2, matching registry `status`"
    remediation: auto
    human_escalation: "registry has no `status` for the project"

  # ------------------------------------------------------------------ executive
  - id: executive.summary
    title: Executive answer within the first screenful
    applies_to: [all]
    severity: required
    check: executive_summary
    evidence: "First H2 is one of: Decision summary / Decision / Key findings / What it does / The idea / Project status / What this is; its prose is at least 20 words, not a list of links"
    remediation: manual
    human_escalation: null

  # ------------------------------------------------------------------ evidence
  - id: evidence.primary
    title: Primary evidence appropriate to the project type
    applies_to: [all]
    severity: required
    check: primary_evidence
    evidence: "analytical: a result chart or result table in the first 150 lines; library: a code example; framework: architecture or workflow diagram; application: screenshot; incomplete: architecture + explicit status"
    remediation: assisted
    human_escalation: null

  - id: evidence.see_it_running
    title: Interface shown before installation instructions
    applies_to: [interactive]
    severity: required
    check: see_it_running
    evidence: "A screenshot, GIF, terminal capture, or hosted-report link appears before the first install/quick-start code block"
    remediation: manual
    human_escalation: "the interface needs credentials, private data, or a paid service to run"

  - id: evidence.demo_motion
    title: GIF or video for interfaces where motion helps
    applies_to: [interactive]
    severity: recommended
    check: demo_motion
    evidence: "A .gif/.mp4/.webm reference or video link; NOT_APPLICABLE when registry `demo: static` is set with a reason"
    remediation: manual
    human_escalation: null

  - id: evidence.live_demo
    title: Live demo link verified or its absence stated
    applies_to: [interactive]
    severity: recommended
    check: live_demo
    evidence: "A hosted URL declared in the registry appears in the README; or the README states no hosted demo exists"
    remediation: manual
    human_escalation: null

  # ------------------------------------------------------------------ navigation
  - id: navigation.audience
    title: Audience paths with at least two depths
    applies_to: [all]
    severity: required
    check: audience_paths
    evidence: "An 'Explore this project' / 'Start here' table or list with >= 2 rows linking to in-repo targets"
    remediation: assisted
    human_escalation: null

  # ------------------------------------------------------------------ analytical
  - id: analytical.decision
    title: Decision or question stated
    applies_to: [analytical]
    severity: required
    check: decision_stated
    evidence: "A 'Decision', 'Decision summary', 'Key findings', 'Research questions' or 'Verified anchors' section, or a question in the identity zone"
    remediation: manual
    human_escalation: null

  - id: analytical.results
    title: Results section, or explicit no-results statement for incomplete projects
    applies_to: [analytical]
    severity: required
    check: results_section
    evidence: "Results/Key findings/Decision heading with quantitative content; incomplete projects: a sentence saying results do not exist yet"
    remediation: manual
    human_escalation: null

  - id: analytical.quantitative
    title: Results are quantitative with a comparator
    applies_to: [analytical]
    severity: required
    check: quantitative_results
    evidence: "At least two numbers with units (%, pp, EUR, MAPE, n=) AND at least one comparator (vs, versus, compared to/with, baseline, against, relative to, delta, a signed percentage or percentage-point change, comparative phrasing such as 'above its', 'x lower', 'lowest') in the results section; NOT_APPLICABLE for incomplete projects"
    remediation: manual
    human_escalation: null
    notes: "v1.3 implemented the comparator the standard had always described. Before v1.3 the check passed on two bare numbers, so a README satisfied it by writing an amount twice."

  - id: analytical.uncertainty
    title: Uncertainty reported for estimated quantities
    applies_to: [analytical]
    severity: required
    check: uncertainty_reported
    evidence: "interval / credible / confidence / percentile / sigma / probability wording near the numbers; NOT_APPLICABLE for incomplete projects or registry `estimation: none`"
    remediation: manual
    human_escalation: null

  - id: analytical.data
    title: Data provenance (source, period, grain, public/private)
    applies_to: [analytical]
    severity: required
    check: data_provenance
    evidence: "A Data / Data sources / Sources heading with at least one source and a period or date"
    remediation: manual
    human_escalation: null

  - id: analytical.epistemic
    title: Epistemic tags on artifacts (VERIFIED / CALIBRATED / SIMULATED / ILLUSTRATIVE)
    applies_to: [analytical]
    severity: required
    check: epistemic_tags
    evidence: "At least one tag used in a table or legend; the legend block explains the tags"
    remediation: assisted
    human_escalation: null

  - id: analytical.method
    title: Method chain (input -> transformation -> model -> validation -> output)
    applies_to: [analytical]
    severity: required
    check: method_section
    evidence: "Method / Methodology / How it works / Pipeline heading"
    remediation: manual
    human_escalation: null

  - id: analytical.validation
    title: Validation mechanism named
    applies_to: [analytical, library, framework]
    severity: required
    check: validation_section
    evidence: "holdout, known truth, baseline, backtest, cross-validation, precision audit, acceptance test, self-test, or a test command; incomplete analytical projects may state the planned mechanism"
    remediation: manual
    human_escalation: null

  - id: analytical.production_data
    title: What changes with production data
    applies_to: [analytical]
    severity: required
    check: production_data
    evidence: "A section on production data / what I would do differently / maintenance roadmap; NOT_APPLICABLE when registry `public_data: false`"
    remediation: manual
    human_escalation: null

  # ------------------------------------------------------------------ technical
  - id: technical.architecture
    title: Architecture diagram inline
    applies_to: [analytical, application, framework]
    severity: required
    check: architecture_inline
    evidence: "```mermaid block, ASCII box diagram, or an architecture image under an Architecture heading. For these types the expected source is a gitdiagram graph restyled to the design system (blocks/architecture-mermaid.md) with the provenance line under it (blocks/architecture-provenance.md), unless the registry declares `architecture_diagram: manual`. `architecture_diagram: none` makes this NOT_APPLICABLE and requires an `architecture_diagram_reason`."
    remediation: assisted
    human_escalation: null
    notes: "Assisted remediation drafts a Mermaid diagram from the top-level package layout; it must be reviewed. The gate checks that an inline diagram exists and that its click targets resolve (technical.architecture_links); it cannot verify that a diagram was generated by gitdiagram, which is why the provenance line is required prose and not a check."

  - id: technical.architecture_links
    title: Architecture diagram click targets resolve
    applies_to: [all]
    severity: recommended
    check: architecture_links
    evidence: "Every `click <node> \"…\"` line in a ```mermaid block points at a path that exists in the checkout, in the repository the registry `github` field names; NOT_APPLICABLE when the diagram has no click lines"
    remediation: manual
    human_escalation: null
    notes: "gitdiagram lowercases the owner in its blob URLs and GitHub resolves them, so an owner/repo case mismatch is reported alongside a PASS rather than as a failure. A path that does not exist is a failure: it is a stale or invented file reference, and it appears the moment the repository is refactored."

  - id: technical.structure
    title: Repository structure with responsibilities
    applies_to: [all]
    severity: required
    check: repo_structure
    evidence: "Repository structure / Repository map / Modules / What's inside heading with a tree or table naming >= 3 real top-level paths"
    remediation: auto
    human_escalation: null
    notes: "Auto remediation lists real top-level paths and file counts only; it never invents responsibilities."

  - id: technical.reproduce
    title: Reproduce / install / quick start with runnable commands
    applies_to: [all]
    severity: required
    check: reproduce_section
    evidence: "Reproduce / Quick start / Install / Usage heading followed by a shell or python code block; commands reference files that exist (Makefile targets, scripts, pyproject)"
    remediation: manual
    human_escalation: null

  - id: technical.stack
    title: Stack table with reasons
    applies_to: [all]
    severity: recommended
    check: stack_table
    evidence: "A Stack / Technology heading with a table"
    remediation: assisted
    human_escalation: null

  # ------------------------------------------------------------------ library
  - id: library.example
    title: Minimal working example
    applies_to: [library, framework]
    severity: required
    check: minimal_example
    evidence: "A python/yaml/bash code block under Quick start / Minimal example / Usage"
    remediation: manual
    human_escalation: null

  - id: library.contract
    title: Behavioural contract or acceptance test
    applies_to: [library, framework]
    severity: required
    check: behavioural_contract
    evidence: "What it enforces / Acceptance test / gate table / guarantees section"
    remediation: manual
    human_escalation: null

  - id: library.api
    title: API or command reference for the public surface
    applies_to: [library]
    severity: required
    check: api_reference
    evidence: "API reference / Reference / Commands heading with parameter tables or signatures"
    remediation: manual
    human_escalation: null

  - id: library.install_pin
    title: Install line with a version pin or release model
    applies_to: [library, framework]
    severity: recommended
    check: install_pin
    evidence: "@vX.Y.Z, ==X.Y, or a Releases section"
    remediation: manual
    human_escalation: null

  # ------------------------------------------------------------------ honesty
  - id: honesty.limitations
    title: Limitations / scope section in the README
    applies_to: [all]
    severity: required
    check: limitations_section
    evidence: "Limitations / Known limits / Scope / Caveats heading with >= 2 bullets or sentences"
    remediation: manual
    human_escalation: null

  - id: honesty.falsification
    title: At least one falsification condition
    applies_to: [analytical]
    severity: recommended
    check: falsification_condition
    evidence: "'reconsider if', 'would change this', 'revisit under', 'falsif' wording"
    remediation: manual
    human_escalation: null

  - id: honesty.placeholders
    title: No placeholders or template residue
    applies_to: [all]
    severity: required
    check: no_placeholders
    evidence: "No TBD / TODO / Coming soon / lorem / <placeholder> / {{ }} / TEMPLATE: markers"
    remediation: manual
    human_escalation: null

  - id: honesty.hype
    title: No unsupported superlatives
    applies_to: [all]
    severity: required
    check: no_hype
    evidence: "No 'state-of-the-art', 'production-ready', 'blazing', 'seamless', 'cutting-edge', 'revolutionary', 'best-in-class', 'highly accurate' without a number in the same sentence"
    remediation: manual
    human_escalation: null

  - id: honesty.status_section
    title: Status section stating what exists and what does not
    applies_to: [all]
    severity: required
    check: status_section
    evidence: "## Status heading with the vocabulary term and a date or milestone"
    remediation: auto
    human_escalation: "registry has no `status`"

  - id: honesty.no_results_statement
    title: Incomplete projects say results do not exist
    applies_to: [incomplete]
    severity: required
    check: no_results_statement
    evidence: "Sentence such as 'no results exist yet' / 'results land at M7' / 'what does not exist'"
    remediation: manual
    human_escalation: null

  # ------------------------------------------------------- communication (v1.3)
  # The checkable subset of IBCS Standards 2.0 / ISO 24896:2026 for a repository README, drawn from
  # the UNIFY and CHECK areas: one business concept is presented the same way everywhere, and the
  # visual does not exaggerate the evidence. Deliberately excluded because they need judgement or do
  # not fit this portfolio: scenario notation (actual/plan/forecast — these projects have no
  # plan-versus-actual dimension), message-style headings in library and framework READMEs (where
  # "API reference" is the correct heading), any IBCS score, any IBCS or ISO badge. The judgement
  # items live in docs/AGENT_GUIDE.md as review items and must never become checks.
  #
  # All six land at `recommended` in v1.3: three of the four flagship analytical repositories fail
  # the theme check today. This is the governance-bootstrap ratchet — declare the gap, report it as a
  # warning, promote to `required` in v1.4 once the repositories conform. See README_STANDARD.md §6.

  - id: communication.alt_text
    title: Every figure has alt text
    applies_to: [all]
    severity: recommended
    check: alt_text
    evidence: "Every image in the README that is not a badge shield (matched by URL host), not the banner, and not the author portrait has non-empty alt text; NOT_APPLICABLE when the README has no figures"
    remediation: manual
    human_escalation: null
    notes: "Never auto-fixed: the fixer has not looked at the chart and must not describe it."

  - id: communication.alt_distinct
    title: Alt text describes the figure, not the project
    applies_to: [all]
    severity: recommended
    check: alt_distinct
    evidence: "No figure's alt text equals the registry `descriptor`, no figure repeats the banner's alt text, and no two figures share identical alt text"
    remediation: manual
    human_escalation: null
    notes: "Catches a copy-paste from the banner and any future regression in the fixer. Empty alt text is communication.alt_text's finding, not this one."

  - id: communication.chart_theme
    title: Charts use the portfolio design system
    applies_to: [analytical, library]
    severity: recommended
    check: chart_theme
    evidence: "`bk-viz` is declared as a dependency in pyproject.toml (including the `[tool.uv.sources]` git form) or in a requirements*.txt; NOT_APPLICABLE for bk-viz itself"
    remediation: manual
    human_escalation: null
    notes: "bk-viz's own acceptance test: if two charts from different repositories do not look like siblings, the theme is not applied. Adding the dependency is repository work, out of scope for the standard; this check only reports the gap."

  - id: communication.figure_coverage
    title: The README shows the figures that carry the argument
    applies_to: [analytical]
    severity: recommended
    check: figure_coverage
    evidence: "figures in the README >= min(3, floor(0.25 * figures on disk)); the figure directory is the registry `figures_dir`, else the first of reports/, outputs/figures/, docs/assets/ that holds figures; NOT_APPLICABLE when none does"
    remediation: manual
    human_escalation: null
    notes: "The message names the ratio so the warning is actionable. The cap at three keeps the README an executive interface: this asks for the figures that carry the argument, not for the gallery."

  - id: communication.chart_caption
    title: A caption states what the primary chart shows
    applies_to: [all]
    severity: recommended
    check: chart_caption
    evidence: "Within two lines of the first figure, a paragraph of at least four words (italic, blockquote or plain) that is not identical to the alt text; NOT_APPLICABLE when the README has no figure"
    remediation: manual
    human_escalation: null

  - id: communication.message_heading
    title: A results heading carries the finding
    applies_to: [analytical]
    severity: recommended
    check: message_heading
    evidence: "At least one H2 or H3 in the results section contains a numeral; NOT_APPLICABLE for incomplete projects and when there is no results section"
    remediation: manual
    human_escalation: null
    notes: "A deterministic proxy for a finding-style heading, and only a proxy. The gate does not judge whether the sentence is a good message; that is a review item in docs/AGENT_GUIDE.md."

  # ------------------------------------------------------------------ links
  - id: links.images
    title: Every image reference resolves
    applies_to: [all]
    severity: required
    check: images_resolve
    evidence: "Relative image paths exist on disk; absolute URLs are not checked offline"
    remediation: auto
    human_escalation: null
    notes: "Auto remediation repairs case and moved-file mismatches when the basename is unique in the repo."

  - id: links.internal
    title: Every relative link resolves
    applies_to: [all]
    severity: required
    check: links_resolve
    evidence: "Relative links (files and #anchors) exist; anchors are matched against README headings"
    remediation: auto
    human_escalation: null

  # ------------------------------------------------------------------ meta
  - id: meta.license_file
    title: LICENSE file present
    applies_to: [all]
    severity: required
    check: license_file
    evidence: "LICENSE or LICENSE.md at repo root"
    remediation: auto
    human_escalation: "repo contains third-party code with an incompatible license, or ownership is unclear"
    notes: "Auto remediation follows docs/LICENSE_POLICY.md; never changes an existing license."

  - id: meta.license_section
    title: License section matches the LICENSE file
    applies_to: [all]
    severity: required
    check: license_section
    evidence: "## License heading naming the same license as the LICENSE file"
    remediation: auto
    human_escalation: null

  - id: meta.author
    title: Canonical author block
    applies_to: [all]
    severity: required
    check: author_block
    evidence: "Name, 'Austria', year, the LinkedIn URL, and the portrait <img> (docs/assets/Author_MDS_Rafael_Braga-Kribitz_kroped.png, vendored from blocks/assets/) as in blocks/author.md"
    remediation: auto
    human_escalation: null

  - id: meta.length
    title: README is an executive interface, not a dump
    applies_to: [all]
    severity: required
    check: readme_length
    evidence: "<= max_readme_lines *rendered* lines: prose, headings, list items, table rows and images. Fenced code and diagram blocks, HTML comment lines, badge-only lines and blank lines are not counted. Registry `max_lines` raises the limit only together with a `max_lines_reason`."
    remediation: manual
    human_escalation: null
    notes: "v1.3 changed the unit from raw file lines to rendered lines. Raw counting charged 80 lines for a Mermaid diagram that renders as one figure and 1 line for a 300-character claim comment, which taxed the evidence the standard asks for. The cap stayed at 450; meta.length_total caps the file itself."

  - id: meta.length_total
    title: The file itself stays readable in a diff
    applies_to: [all]
    severity: recommended
    check: readme_length_total
    evidence: "<= max_readme_lines_total raw lines in README.md (registry `max_lines_total` raises the limit only together with a `max_lines_total_reason`)"
    remediation: manual
    human_escalation: null
    notes: "The second ceiling on meta.length: excluded regions (fenced blocks, HTML comments) do not render, but they are still reviewed, diffed and maintained."

  # ------------------------------------------------------------------ excellence (never required)
  - id: excellence.audience_personas
    title: Four-persona audience table
    applies_to: [analytical]
    severity: recommended
    check: audience_personas
    evidence: "Recruiter / Hiring manager / Technical reviewer / Auditor rows"
    remediation: manual
    human_escalation: null
    excellence: true

  - id: excellence.claim_tracing
    title: Claims traced to artifacts
    applies_to: [analytical]
    severity: recommended
    check: claim_tracing
    evidence: "<!-- claim: --> comments, a NUMERIC_SSOT reference, or a digest script mentioned"
    remediation: manual
    human_escalation: null
    excellence: true

  - id: excellence.why
    title: Why this project / what surprised me
    applies_to: [analytical]
    severity: recommended
    check: why_section
    evidence: "Why this project / What surprised me heading"
    remediation: manual
    human_escalation: null
    excellence: true

  - id: excellence.project_specific
    title: Project-specific sections preserved
    applies_to: [all]
    severity: recommended
    check: project_specific_sections
    evidence: "H2 sections outside the standard vocabulary are reported as project_specific_excellence, never as failures"
    remediation: manual
    human_escalation: null
    excellence: true
