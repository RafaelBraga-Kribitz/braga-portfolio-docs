    descriptor: "Segmentation, MILP budget allocation, and Bayesian poll tracking reconstruct one election from public anchors and synthetic voters."
    hero: reports/eda/C1_forecast_timeline.png
    demo: static
    demo_reason: "two app screenshots and a hosted Module C report are in the README; a GIF would need a full pipeline run plus both apps running"
    hosted_urls:
      - https://RafaelBraga-Kribitz.github.io/decision-analytics-reconstruction/

