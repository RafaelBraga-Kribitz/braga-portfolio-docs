# BRAGA public-portfolio registry — declared, human-owned facts per project.
#
# The gate never infers type or status from prose. Everything declared here must be true
# of the repository; the fixer copies these values into badges, status lines, and the hero.
#
# repos_root: folder that contains the checkouts (override with BRAGA_REPOS_ROOT or --repos-root).
# Default when unset: the parent folder of this repository's checkout.
repos_root: null

author:
  name: Rafael Braga-Kribitz
  location: Austria
  place: Seiersberg-Pirka, Austria
  year: "2026"
  linkedin: https://www.linkedin.com/in/rafaelbragakribitz/
  email: rafaelbragakribitz@gmail.com
  github: RafaelBraga-Kribitz

status_vocabulary: [Prototype, Foundation, In development, Functional, Complete, Maintained, Archived]

# Fields (see readme_quality/registry.py for defaults):
#   type: analytical | application | library | framework | docs
#   status: vocabulary term (required for the status checks to be auto-fixable)
#   title / descriptor: used by the hero generator and the H1 fix; must be factual
#   hero: "generated" or a repo-relative path to an existing chart / screenshot
#   hero_path: where the generated banner is written
#   demo: motion | static  (static requires demo_reason)  — interactive projects only
#   hosted_urls: verified live URLs that must appear in the README
#   license: override for the license policy; license_blocked_reason: escalate instead of creating a file
#   public_data: false => production-data section not required
#   estimation: none => uncertainty check not applicable

projects:
  - name: decision-analytics-reconstruction
    github: RafaelBraga-Kribitz/decision-analytics-reconstruction
    path: decision-analytics-reconstruction
    type: analytical
    interactive: true
    status: Functional
